name: Diagnostic Apple smoke (Mac and Watch46 only)
permissions:
  contents: read
concurrency:
  group: qrcatcher-apple-platforms
  cancel-in-progress: false
env:
  DIAGNOSTIC_ONLY: 'true'
jobs:
  preflight:
    name: Compile and verify setup before runtime matrix
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      QRCATCHER_OWNED_PROCESS_BARRIER: ${{ github.workspace }}/build/owned-process-cleanup.json
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 64
        ref: ${{ github.sha }}
    - name: Verify exact source and prepare bounded build inputs
      if: ${{ env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      run: |
        python3 scripts/owned_process_barrier.py --check
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = 100mango/QRCatcher
        python3 scripts/diagnostic_smoke_route.py validate
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --
        git rev-parse 'HEAD^{tree}'
        sw_vers
        xcodebuild -version
        xcodebuild -version | grep '27A266a'
        test "$(uname -m)" = arm64
        python3 -m unittest discover -s Tests/Harness -p 'test_*.py' -v
        python3 scripts/verify_portable_source.py
        python3 scripts/materialize_qr_fixtures.py
        python3 scripts/materialize_mac_icons.py
        python3 scripts/materialize_ipad_icons.py
        xcrun swift scripts/materialize_native_icons.swift
        python3 scripts/generate_project.py
        git diff --exit-code -- QRCatcher.xcodeproj
        python3 scripts/validate_evidence_budget.py --validate-allocation
        git diff --exit-code 9abdd5e8150b47fc176d203db23db10854c81188 -- QRCatcher/QR.xcdatamodeld QRCatcher/QRHistoryStore.m QRCatcher/URLEntity.h QRCatcher/URLEntity.m
    - name: Build all test schemes and verify actual Debug Watch embedding
      timeout-minutes: 16
      if: ${{ env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      run: |
        python3 scripts/owned_process_barrier.py --check
        python3 -u scripts/compile_platform_preflight.py
    - name: Verify preflight source stayed unchanged
      if: ${{ always() }}
      run: git diff --exit-code HEAD --
  platform:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      QRCATCHER_OWNED_PROCESS_BARRIER: ${{ github.workspace }}/build/owned-process-cleanup.json
      EVIDENCE_SCOPE: ${{ matrix.scope }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 64
        ref: ${{ github.sha }}
    - name: Verify exact source and stable toolchain
      if: ${{ env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      run: |
        python3 scripts/owned_process_barrier.py --check
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = 100mango/QRCatcher
        python3 scripts/diagnostic_smoke_route.py validate
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --
        echo "Tested commit: $(git rev-parse HEAD)"
        echo "Tested tree: $(git rev-parse 'HEAD^{tree}')"
        shasum -a 256 .github/workflows/apple-platforms.yml
        sw_vers
        xcodebuild -version
        xcodebuild -version | grep '27A266a'
        test "$(uname -m)" = arm64
        python3 Tests/Harness/test_ios_launcher.py
        python3 Tests/Harness/test_watch_process.py
        python3 Tests/Harness/test_required_reason_symbols.py
        python3 Tests/Harness/test_atomic_json.py
        python3 Tests/Harness/test_vision_ui_cases.py
        python3 Tests/Harness/test_embedded_watch_gate.py
        python3 scripts/verify_portable_source.py
        python3 scripts/materialize_qr_fixtures.py
        python3 scripts/materialize_mac_icons.py
        python3 scripts/materialize_ipad_icons.py
        xcrun swift scripts/materialize_native_icons.swift
        python3 scripts/generate_project.py
        git diff --exit-code -- QRCatcher.xcodeproj
        plutil -lint QRCatcherMac/Info.plist QRCatcherVision/Info.plist QRCatcher/Info.plist QRCatcher/PrivacyInfo.xcprivacy
        xcodebuild -list -project QRCatcher.xcodeproj

        python3 scripts/validate_evidence_budget.py --validate-allocation
        git diff --exit-code 9abdd5e8150b47fc176d203db23db10854c81188 -- QRCatcher/QR.xcdatamodeld QRCatcher/QRHistoryStore.m QRCatcher/URLEntity.h QRCatcher/URLEntity.m
    - name: Verify unsigned native Watch device Release package
      if: ${{ ((matrix.scope == 'watchos') && (!cancelled())) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 8
      run: |
        python3 scripts/owned_process_barrier.py --check
        set -o pipefail
        python3 -u scripts/run_bounded.py 435 xcodebuild build -project QRCatcher.xcodeproj -scheme QRCatcherWatch -configuration Release -derivedDataPath build/ReleaseWatch -destination 'generic/platform=watchOS' CODE_SIGNING_ALLOWED=NO | tee release-watch.log
        python3 scripts/verify_native_release.py Watch
        python3 scripts/inspect_watch_cpp_compat.py build/ReleaseWatch/Build/Products/Release-watchos/QRCatcherWatch.app
    - name: Verify unsigned iOS Release with its actual embedded Watch app
      if: ${{ ((matrix.scope == 'watchos') && (!cancelled())) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 8
      run: |
        python3 scripts/owned_process_barrier.py --check
        python3 -u scripts/run_bounded.py 435 xcodebuild build -project QRCatcher.xcodeproj -scheme QRCatcher -configuration Release -derivedDataPath build/iOS -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
        python3 scripts/verify_embedded_watch.py device
        python3 scripts/inspect_watch_cpp_compat.py build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/Watch/QRCatcherWatch.app ios-embedded-watch
        git diff --exit-code 9abdd5e8150b47fc176d203db23db10854c81188 -- QRCatcher/QR.xcdatamodeld QRCatcher/QRHistoryStore.m QRCatcher/URLEntity.h QRCatcher/URLEntity.m
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/Info.plist)" = '100mango.QRCatcher'
        test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/Info.plist)" = '15.0'
        /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/Info.plist
        python3 - <<'PYCODE'
        import plistlib
        from pathlib import Path
        import sys,json
        sys.path.insert(0,'scripts')
        from required_reason_symbols import inspect_file_reader_imports
        imports=inspect_file_reader_imports('build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/QRCatcher',True)
        Path('build/native-release-evidence').mkdir(exist_ok=True)
        Path('build/native-release-evidence/ios-reader-imports.json').write_text(json.dumps({'actual_file_metadata_imports':imports}))
        info=plistlib.loads(Path('build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/Info.plist').read_bytes())
        assert 'UIFileSharingEnabled' not in info and 'LSSupportsOpeningDocumentsInPlace' not in info
        value=plistlib.loads(Path('build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/PrivacyInfo.xcprivacy').read_bytes())
        assert value['NSPrivacyAccessedAPITypes']==[{'NSPrivacyAccessedAPIType':'NSPrivacyAccessedAPICategoryFileTimestamp','NSPrivacyAccessedAPITypeReasons':['C617.1','3B52.1']}]
        assert value['NSPrivacyCollectedDataTypes']==[] and value['NSPrivacyTracking'] is False
        print('VERIFIED_IOS_APP_CONTAINER_REQUEST_METADATA_REASON',flush=True)
        PYCODE
        strings build/iOS/Build/Products/Release-iphoneos/QRCatcher.app/QRCatcher > build/ios-release-strings.txt
        if grep -E -- '-ui-testing|-fixture-payload|-fixture-empty|-reset-history|QRCATCHER_CAMERA_TRACE' build/ios-release-strings.txt; then exit 1; fi
    - name: Build native Mac unsigned Release arm64 and x86_64
      if: ${{ ((matrix.scope == 'macos') && (!cancelled())) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 10
      run: |
        python3 scripts/owned_process_barrier.py --check
        set -o pipefail
        python3 -u scripts/run_bounded.py 555 xcodebuild build -project QRCatcher.xcodeproj -scheme QRCatcherMac -configuration Release -derivedDataPath build/MacRelease -destination 'generic/platform=macOS' ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO | tee mac-build.log
        APP=build/MacRelease/Build/Products/Release/QRCatcherMac.app
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = '100mango.QRCatcher'
        ARCHITECTURES=$(xcrun lipo -archs "$APP/Contents/MacOS/QRCatcherMac")
        echo "Verified native slices: $ARCHITECTURES"
        [[ " $ARCHITECTURES " == *" arm64 "* && " $ARCHITECTURES " == *" x86_64 "* ]]
        xcrun lipo -info "$APP/Contents/MacOS/QRCatcherMac"
        python3 scripts/verify_mac_release.py
        python3 - <<'PYCODE'
        import plistlib
        from pathlib import Path
        value=plistlib.loads(Path('build/MacRelease/Build/Products/Release/QRCatcherMac.app/Contents/Resources/PrivacyInfo.xcprivacy').read_bytes())
        assert value['NSPrivacyAccessedAPITypes']==[{'NSPrivacyAccessedAPIType':'NSPrivacyAccessedAPICategoryFileTimestamp','NSPrivacyAccessedAPITypeReasons':['C617.1','3B52.1']}] and value['NSPrivacyCollectedDataTypes']==[] and value['NSPrivacyTracking'] is False
        print('VERIFIED_MAC_MINIMAL_PRIVACY_MANIFEST',flush=True)
        PYCODE
        ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")
        test -n "$ICON"
        ICON_PATH="$APP/Contents/Resources/${ICON%.icns}.icns"
        test -s "$ICON_PATH"
        shasum -a 256 "$ICON_PATH"
        mkdir -p build/icon-verification
        xcrun swift scripts/verify_mac_icon.swift "$ICON_PATH" build/icon-verification/mac-bundled-icon.png
        strings "$APP/Contents/MacOS/QRCatcherMac" > build/mac-release-strings.txt
        if grep -E -- 'QRCATCHER_TEST_STORE|QRCATCHER_SANDBOX_|sandboxDiagnostics|fixture-payload|reset-history|MAC_NATIVE_AX_' build/mac-release-strings.txt; then exit 1; fi
    - name: Execute native Mac hosted regression tests
      if: ${{ ((matrix.scope == 'macos') && (!cancelled())) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 20
      run: |
        python3 scripts/owned_process_barrier.py --check
        set -o pipefail
        python3 -u scripts/run_bounded.py 1155 xcodebuild test -project QRCatcher.xcodeproj -scheme QRCatcherMac -configuration Debug -derivedDataPath build/MacTests -destination 'platform=macOS,arch=arm64' ARCHS=arm64 -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 150 -only-testing:QRCatcherMacTests -resultBundlePath MacTestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee mac-test.log
    - name: Execute ephemeral ad-hoc App Sandbox UI gate
      if: ${{ ((matrix.scope == 'macos') && (!cancelled())) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 15
      run: |
        python3 scripts/owned_process_barrier.py --check
        bash scripts/run_mac_sandbox.sh
    - name: Export bounded native Mac screenshots
      if: ${{ (matrix.scope == 'macos') && (always()) }}
      timeout-minutes: 3
      run: python3 -u scripts/export_mac_screenshots.py
    - name: Retain diagnostic identity for macos
      id: mac_diagnostic_identity
      if: ${{ matrix.scope == 'macos' && always() }}
      timeout-minutes: 1
      run: python3 scripts/diagnostic_smoke_route.py retain
    - name: Validate native Mac outbound evidence budget
      id: mac_evidence_budget
      if: ${{ (matrix.scope == 'macos') && (always()) }}
      run: python3 scripts/validate_evidence_budget.py build/mac-evidence --scope "$EVIDENCE_SCOPE" --report build/mac-evidence-budget.json
    - name: Retain small native Mac evidence
      if: ${{ (matrix.scope == 'macos') && (always() && steps.mac_evidence_budget.outcome == 'success' && steps.mac_diagnostic_identity.outcome == 'success') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qrcatcher-diagnostic-smoke-${{ matrix.scope }}-evidence
        path: build/mac-evidence
        retention-days: 1
        compression-level: 9
        if-no-files-found: error
    - name: Compile native Watch local decode and paired-phone state tests
      id: watch_test_build
      if: ${{ (startsWith(matrix.scope, 'watchos') && (!cancelled())) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 8
      run: |
        python3 scripts/owned_process_barrier.py --check
        set -o pipefail
        if [[ "$EVIDENCE_SCOPE" == watchos ]]; then python3 scripts/settings_build_provenance.py begin watch; fi
        python3 -u scripts/run_bounded.py 435 xcodebuild build-for-testing -project QRCatcher.xcodeproj -scheme QRCatcherWatch -configuration Debug -derivedDataPath build/WatchTests -destination 'generic/platform=watchOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO | tee watch-test-build.log
        if [[ "$EVIDENCE_SCOPE" == watchos ]]; then python3 scripts/settings_build_provenance.py finish watch; fi
    - name: Execute actual Watch local decode history and native UI
      if: ${{ (startsWith(matrix.scope, 'watchos') && (!cancelled() && steps.watch_test_build.outcome == 'success')) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 22
      run: |
        export QRCATCHER_RUNTIME_PARENT_START="$(python3 -c 'import time; print(format(time.monotonic(), ".6f"))')"
        python3 scripts/owned_process_barrier.py --check
        python3 -u scripts/run_watch_platform_tests.py
    - name: Stop Watch simulator before phone and iPad matrix
      if: ${{ (startsWith(matrix.scope, 'watchos') && (always() && env.WATCH_SIMULATOR_ID != '' && env.WATCH_SIZE_CLEANUP_UNCONFIRMED != 'true')) && env.QRCATCHER_OWNED_CLEANUP_UNCONFIRMED != 'true' }}
      timeout-minutes: 1
      run: |
        python3 scripts/owned_process_barrier.py --check
        python3 -u scripts/run_bounded.py 45 xcrun simctl shutdown "$WATCH_SIMULATOR_ID" || true
    - name: Export bounded phone and iPad evidence
      if: ${{ (matrix.scope != 'macos' && !startsWith(matrix.scope, 'visionos_')) && (always()) }}
      timeout-minutes: 3
      run: python3 -u scripts/export_ios_platform_screenshots.py
    - name: Retain diagnostic identity for watchos
      id: watch_diagnostic_identity
      if: ${{ matrix.scope == 'watchos' && always() }}
      timeout-minutes: 1
      run: python3 scripts/diagnostic_smoke_route.py retain
    - name: Validate isolated platform and whole-run evidence allocation
      id: platform_evidence_budget
      if: ${{ (matrix.scope != 'macos') && (always()) }}
      run: python3 scripts/validate_evidence_budget.py build/ios-platform-evidence --scope "$EVIDENCE_SCOPE" --report build/platform-evidence-budget.json
    - name: Retain small phone and iPad evidence
      if: ${{ (matrix.scope != 'macos') && (always() && steps.platform_evidence_budget.outcome == 'success' && steps.watch_diagnostic_identity.outcome == 'success') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qrcatcher-diagnostic-smoke-${{ matrix.scope }}-evidence
        path: build/ios-platform-evidence
        retention-days: 1
        compression-level: 9
        if-no-files-found: error
    - name: Summarize executed evidence
      if: always()
      timeout-minutes: 3
      run: |
        for RESULT in WatchUnitResults.xcresult WatchUIResults.xcresult TVTestResults.xcresult TVAuthorizedUIResults.xcresult TVRevokedUIResults.xcresult VisionTestResults.xcresult VisionUIResults.xcresult VisionPhotosUIResults.xcresult VisionFilesUIResults.xcresult VisionChineseUIResults.xcresult VisionLargestUIResults.xcresult MacTestResults.xcresult MacSandboxResults.xcresult iOSUnitResults.xcresult PhoneUIResults.xcresult CompactPhoneUIResults.xcresult PadUIResults.xcresult MiniUIResults.xcresult; do
          if [ -f "$RESULT/Info.plist" ]; then xcrun xcresulttool get test-results summary --path "$RESULT"; fi
        done
        echo 'Runtime proof requires successful Mac XCTest; x86_64 build is separate from runtime proof. Physical camera capture/denial/disconnect and paired Watch background file transport remain physical-device gates; exact sandbox/platform outcomes are reported separately.' >> "$GITHUB_STEP_SUMMARY"
    - name: Verify source stayed unchanged
      if: always()
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --
        echo "Final tested tree: $(git rev-parse 'HEAD^{tree}')"
        shasum -a 256 .github/workflows/apple-platforms.yml
    name: ${{ matrix.scope }} · diagnostic-only fresh standard VM
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scope:
        - macos
        - watchos
'on':
  push:
    branches:
    - codex/apple-platforms-diagnostic-smoke47
