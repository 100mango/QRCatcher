name: iOS regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qrcatcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify stable cloud toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -version | grep -E '^Xcode 27(\.0)?$'
          xcodebuild -version | grep '27A266a'
      - name: Validate project and select iOS 27 simulator
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- QRCatcher.xcodeproj
          plutil -lint QRCatcher/Info.plist QRCatcher/PrivacyInfo.xcprivacy
          xcodebuild -list -project QRCatcher.xcodeproj
          python3 - <<'PY'
          import json,subprocess,os
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          candidates=[d for r,devices in data['devices'].items() if r.endswith('iOS-27-0') for d in devices if d['name'].startswith('iPhone')]
          assert candidates, 'Stable iOS 27.0 iPhone simulator unavailable'
          d=sorted(candidates,key=lambda d:('Pro Max' not in d['name'],d['name']))[0]
          print('Selected',d)
          compact=next((c for c in candidates if c['name']=='iPhone 17e'), candidates[-1])
          print('Compact layout device',compact)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SIMULATOR_ID='+d['udid']+'\n')
              f.write('COMPACT_SIMULATOR_ID='+compact['udid']+'\n')
          PY
      - name: Build unsigned device Release and verify identity
        timeout-minutes: 8
        run: |
          xcodebuild build -project QRCatcher.xcodeproj -scheme QRCatcher -configuration Release -derivedDataPath build/DerivedData -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          APP=build/DerivedData/Build/Products/Release-iphoneos/QRCatcher.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = '100mango.QRCatcher'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '15.0'
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$APP/Info.plist"
          lipo -info "$APP/QRCatcher"
          strings "$APP/QRCatcher" > release-strings.txt
          if grep -E -- '-ui-testing|-fixture-payload|-fixture-empty|-reset-history' release-strings.txt; then
            echo 'Debug-only test seams leaked into the Release binary'; exit 1
          fi
      - name: Build and run unit regression tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild test -project QRCatcher.xcodeproj -scheme QRCatcher -configuration Debug -derivedDataPath build/DerivedData -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:QRCatcherTests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -parallel-testing-enabled NO -resultBundlePath UnitTestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee test.log
      - name: Run large-phone UI regression tests
        timeout-minutes: 10
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test -project QRCatcher.xcodeproj -scheme QRCatcher -configuration Debug -derivedDataPath build/DerivedData -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:QRCatcherUITests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Run compact-phone UI regression tests
        timeout-minutes: 10
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$COMPACT_SIMULATOR_ID" -b
          xcodebuild test -project QRCatcher.xcodeproj -scheme QRCatcher -configuration Debug -derivedDataPath build/DerivedData -destination "platform=iOS Simulator,id=$COMPACT_SIMULATOR_ID" -only-testing:QRCatcherUITests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -parallel-testing-enabled NO -resultBundlePath CompactTestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Analyze application sources
        timeout-minutes: 5
        run: xcodebuild analyze -project QRCatcher.xcodeproj -scheme QRCatcher -configuration Debug -derivedDataPath build/DerivedData -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Simulator diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          xcrun simctl list devices booted
          vm_stat
          ps -axo pid,pcpu,pmem,comm | sort -k 2 -nr | head -n 20
          for DEVICE in "$SIMULATOR_ID" "${COMPACT_SIMULATOR_ID:-}"; do
            if [ -n "$DEVICE" ]; then
              xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "QRCatcher" OR process == "QRCatcherUITests-Runner" OR process == "testmanagerd"' | tail -n 150 || true
            fi
          done
      - name: Summarize test evidence
        if: always()
        timeout-minutes: 2
        run: |
          for RESULT in UnitTestResults.xcresult TestResults.xcresult CompactTestResults.xcresult; do
            if [ -f "$RESULT/Info.plist" ]; then xcrun xcresulttool get test-results summary --path "$RESULT"; fi
          done
          echo 'Physical-device camera, signing, App Store metadata and release approval remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
