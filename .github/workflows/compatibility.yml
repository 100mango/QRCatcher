name: Official legacy runtime feasibility
'on':
  push:
    branches: [codex/compatibility-matrix]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supplemental-ios-compatibility
  cancel-in-progress: false
jobs:
  eligible-runtime:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # official v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact test-only controller
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 100mango/QRCatcher
          test "$GITHUB_REF" = refs/heads/codex/compatibility-matrix
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "CONTROLLER_PROVENANCE commit=$GITHUB_SHA tree=$(git rev-parse 'HEAD^{tree}')"
          shasum -a 256 .github/workflows/compatibility.yml .github/compatibility/probe_runtime15.py
      - name: Inventory actual standard macOS 26 host
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sw_vers; uname -m
          ls -d /Applications/Xcode*.app
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E 'iPhone SE|iPad mini'
          df -h /
      - name: Validate official eligibility and bounded install and boot
        timeout-minutes: 23
        run: python3 .github/compatibility/probe_runtime15.py
      - name: Assert unchanged controller and report boundaries
        if: always()
        run: |
          git diff --exit-code HEAD --
          echo 'This run only probes official iOS15.5 runtime feasibility on the actual host. No app feature or checked-in XCTest pass is claimed.' >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 .github/workflows/compatibility.yml .github/compatibility/probe_runtime15.py
